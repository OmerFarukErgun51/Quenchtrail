<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Demir Usta — Dövme Prototipi</title>
<style>
  :root{--bg:#160d08;--panel:#241710;--edge:#3a2616;--wood:#6b4a2a;--accent:#f4a93a;--text:#ffe2b8;--muted:#9a7b58}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center;padding:12px 16px 24px}
  .wrap{width:100%;max-width:420px}
  h1{font-size:18px;margin:4px 0 2px;color:var(--accent);text-align:center}
  .sub{font-size:12px;color:var(--muted);text-align:center;margin:0 0 10px}
  .steps{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .step{font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:3px 6px}
  .step.on{color:#1b120c;background:var(--accent);border-color:var(--accent)}
  .step.done{color:var(--accent);border-color:var(--wood)}
  canvas{display:block;width:100%;aspect-ratio:180/240;image-rendering:pixelated;border:4px solid var(--edge);border-radius:14px;
    background:#1a0f09;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
  .cap{text-align:center;font-weight:800;color:var(--accent);margin:10px 0 2px;font-size:16px;min-height:20px}
  .hint{text-align:center;font-size:13px;color:var(--muted);min-height:36px;line-height:1.45}
  .hint b{color:var(--text)}
  .bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .grp{font-size:11px;color:var(--muted);text-align:center;width:100%;margin-top:4px}
  .btn{background:var(--edge);border:1px solid var(--wood);color:#ffcf8a;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;min-width:84px}
  .btn.sel{background:var(--accent);color:#1b120c;border-color:var(--accent)}
  .btn.go{background:#c8571c;color:#fff;border-color:#ff8a3a}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.slot{min-width:96px;border-width:2px}
  table.res{margin:8px auto 0;border-collapse:collapse;font-size:12px}
  table.res td{padding:2px 8px;color:var(--muted)}
  table.res td:last-child{color:var(--text);font-weight:700;text-align:right}
  .wname{font-size:18px;font-weight:800;margin:2px 0 0;text-shadow:0 2px 6px #000}
  .walt{font-size:12px;color:var(--muted);margin-bottom:6px}
  .nameform{display:flex;gap:6px;justify-content:center;margin:4px 0}
  .nameform input{background:var(--panel);border:1px solid var(--wood);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;width:170px}
  .ladder{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:8px 0 2px}
  .lt{font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;border:1px solid var(--c);color:var(--c)}
  .lt.off{opacity:.25;border-style:dashed}
  .lt.cur{background:var(--c);color:#1b120c;font-weight:800}
  .lnote{font-size:11px;color:var(--muted)}
  .found{color:#7fe0a0;font-weight:700}
  .inv{margin-top:14px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
  .invh{font-weight:800;color:var(--accent);margin-bottom:6px}
  .ores{display:flex;flex-wrap:wrap;gap:5px}
  .ore{font-size:12px;border:1px solid;border-radius:8px;padding:3px 7px;color:var(--text)}
  .imsg{font-size:12px;margin-top:8px;color:var(--text)}
  .invs{font-size:11px;color:var(--muted);margin:10px 0 4px}
  .wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--edge);font-size:12px}
  .wrow small{color:var(--muted)}
  .btn.melt{min-width:0;padding:6px 10px;font-size:12px}
  .btn.reset{min-width:0;padding:5px 9px;font-size:11px;margin-top:8px;opacity:.8}
  .empty{font-size:12px;color:var(--muted)}
  .note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚒️ Dövme Prototipi</h1>
  <p class="sub">Oynanabilir taslak · fare veya dokunmatik</p>
  <div class="steps" id="steps"></div>
  <canvas id="cv" width="180" height="240"></canvas>
  <div class="cap" id="cap"></div>
  <div class="hint" id="hint"></div>
  <div class="bar" id="bar"></div>
  <div class="inv" id="inv"></div>
  <div class="note">SÜSLE bu prototipte yok (oyunda ileride açılan adım).<br>
    Masaüstünde ISIT adımında <b>boşluk</b> tuşu da körüğü pompalar.</div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), g=cv.getContext('2d');
  var W=180, H=240;
  g.imageSmoothingEnabled=false;
  function $(id){return document.getElementById(id);}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}

  // ---------- renk ----------
  function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
  function toHex(a){return '#'+a.map(function(v){return ('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);}).join('');}
  function mix(a,b,t){var A=hex(a),B=hex(b);return toHex(A.map(function(v,i){return v+(B[i]-v)*t;}));}
  function avgCol(cols){var s=[0,0,0];cols.forEach(function(c){hex(c).forEach(function(v,i){s[i]+=v;});});return toHex(s.map(function(v){return v/cols.length;}));}
  var HEAT_STOPS=[[0,'#4a3a32'],[.3,'#7a1a10'],[.5,'#c8281a'],[.65,'#ff6a1a'],[.8,'#ffc23a'],[1,'#fff6d8']];
  function heatColor(h){
    h=clamp(h,0,1);
    for(var i=1;i<HEAT_STOPS.length;i++){
      if(h<=HEAT_STOPS[i][0]){var a=HEAT_STOPS[i-1],b=HEAT_STOPS[i];return mix(a[1],b[1],(h-a[0])/(b[0]-a[0]));}
    }
    return HEAT_STOPS[HEAT_STOPS.length-1][1];
  }

  // ---------- veri ----------
  var STEPS=['Malzeme','Isıt','Dök','Döv','Soğut','Bile','Birleştir','Sonuç'];
  // minT/maxT: metalin kademe aralığı. Performans tabanı aralığın içine yayar (en fazla maxT-1), şans en fazla maxT'ye iter.
  var METALS={
    demir:{ad:'Demir',zc:.50,zw:.13,agi:.7,hasar:20,minT:0,maxT:4,gr:1200,deger:40,rank:0,dur:85,blade:'#8a8f96',ingot:'#6d6a66'},
    celik:{ad:'Çelik',zc:.60,zw:.09,agi:1.0,hasar:34,minT:0,maxT:5,gr:950,deger:120,rank:1,dur:78,blade:'#c3ccd6',ingot:'#8d96a0'},
    mitril:{ad:'Mitril',zc:.72,zw:.055,agi:1.6,hasar:58,minT:2,maxT:6,gr:520,deger:600,rank:2,dur:92,blade:'#a8f0f4',ingot:'#9fe3e8'}
  };
  var MKEYS=['demir','celik','mitril'];
  // anahtar: demir,çelik,mitril külçe sayısı
  var ALLOYS={'2,1,0':'Karbonlu Demir','1,2,0':'Sertleşmiş Çelik','2,0,1':'Mitril Damarlı Demir','1,0,2':'Gök Demiri',
              '0,2,1':'Ay Çeliği','0,1,2':'Mitril Çeliği','1,1,1':'Üç Damar'};
  var BULUNUR=['Bol','Seyrek','Kıymetli'];
  var COAL={az:{ad:'Az',k:.7},orta:{ad:'Orta',k:1},cok:{ad:'Çok',k:1.45}};
  var LIQ={
    // rate: soğuma hızı (sn başına). Kiraz kırmızısı kademesi yağda ~1,5 sn, suda ~1,2 sn, buz suyunda ~1 sn sürer.
    su:{ad:'Su',rate:.12,col:'#2e6fb0',ipucu:'Keskinlik↑ kırılganlık↑ · hızlı soğur'},
    yag:{ad:'Yağ',rate:.09,col:'#7a5a18',ipucu:'Sağlam, dengeli · yavaş soğur (kolay)'},
    buz:{ad:'Buz suyu',rate:.14,col:'#7fd6ef',ipucu:'+Buz özelliği · çok hızlı soğur'}
  };
  var TIERS=[['Kırık','#8a735e'],['Sıradan','#c9c2b8'],['Yaygın Olmayan','#5fcf6a'],['Nadir','#4aa3ff'],
             ['Epik','#b06cff'],['Efsanevi','#ff9a2a'],['Mitik','#ff4fa0']];
  var WEIGHTS={heat:.25,forge:.30,quench:.20,grind:.25}; // kılıç: BİLE ve DÖV ağır

  // Potadaki 3 külçeden metalin/alaşımın özelliklerini çıkarır.
  function alloy(slots){
    var n={demir:0,celik:0,mitril:0}; slots.forEach(function(s){n[s]++;});
    var key=n.demir+','+n.celik+','+n.mitril;
    function avg(f){var s=0;slots.forEach(function(k){s+=METALS[k][f];});return s/slots.length;}
    var dom=MKEYS.reduce(function(a,b){return n[b]>n[a]||(n[b]===n[a]&&METALS[b].rank>METALS[a].rank)?b:a;});
    var mixed=MKEYS.filter(function(k){return n[k]>0;}).length>1;
    var tr=[];
    if(n.demir>=2) tr.push('⚓ Ağır');
    if(n.celik>=2) tr.push('🔪 Sert');
    if(n.mitril>=2) tr.push('🪶 Hafif','🛡️ Paslanmaz');
    if(n.mitril>=1) tr.push('✨ Büyü iletken');
    if(mixed) tr.push('⚗️ Alaşım');
    return {key:key,n:n,dom:dom,mixed:mixed,ad:ALLOYS[key]||METALS[dom].ad,
      zc:avg('zc'),zw:avg('zw')*(mixed?.85:1),agi:avg('agi'),hasar:avg('hasar'),dur:avg('dur'),
      D:clamp(avg('rank')/2+(mixed?.1:0),0,1), // zorluk 0..1: ISIT ve BİLE bununla sertleşir
      minT:Math.round(avg('minT')),maxT:Math.round(avg('maxT')),gr:Math.round(avg('gr')),
      deger:avg('deger')*(mixed?1.15:1),bulunur:BULUNUR[Math.round(avg('rank'))],
      blade:avgCol(slots.map(function(k){return METALS[k].blade;})),traits:tr,st:STYLES[key]};
  }
  var FOUND={};
  try{FOUND=JSON.parse(localStorage.getItem('demirusta_alasimlar')||'{}')||{};}catch(e){}
  function discover(A){
    if(!A.mixed||FOUND[A.key]) return false;
    FOUND[A.key]=1;
    try{localStorage.setItem('demirusta_alasimlar',JSON.stringify(FOUND));}catch(e){}
    return true;
  }

  // ---------- silah adı: özellikten otomatik ad, üst kademede özel isim ----------
  // Tema, silahın baskın özelliğinden seçilir; her tema kendi kelime havuzunu taşır.
  var THEMES={
    buz:   {sifat:'Buzlu',    unvan:['Ayazın','Kuzeyin','Karların'],      destan:['Kışın Dişi','Donmuş Yemin','Ayaz Gözyaşı'],  lakap:'Buz Kesen'},
    isik:  {sifat:'Işıltılı', unvan:['Şafağın','Yıldızların','Ayın'],     destan:['Yıldız Kırığı','Şafak Kesen','Ay Işığı'],    lakap:'Işık Taşıyan'},
    keskin:{sifat:'Keskin',   unvan:['Rüzgârın','Fırtınanın','Şimşeğin'], destan:['Sessiz Pençe','Şimşek Dili','Rüzgâr Fısıltısı'], lakap:'Yel Biçen'},
    agir:  {sifat:'Ağır',     unvan:['Dağın','Kayanın','Toprağın'],       destan:['Dağ Kalbi','Taş Yürek','Yer Sarsan'],       lakap:'Dağ Yaran'},
    sert:  {sifat:'Sert',     unvan:['Örsün','Kalenin','Nöbetin'],        destan:['Kırılmaz Söz','Demir Yemin','Son Nöbet'],   lakap:'Kırılmaz'},
    genel: {sifat:'Dengeli',  unvan:['Ustanın','Yolcunun','Bekçinin'],    destan:['Sessiz Yemin','Ocak Bekçisi','Kor Yürek'],  lakap:'Ocağın Mirası'}
  };
  var METAL_SIFAT={demir:'Ağır',celik:'Sert',mitril:'Hafif'};
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function themeOf(R){
    var A=S.A;
    if(S.liq==='buz') return 'buz';
    if(A.n.mitril>=2) return 'isik';
    if(R.keskin>=80) return 'keskin';
    if(A.dom==='demir') return 'agir';
    if(A.dom==='celik') return 'sert';
    return A.n.mitril?'isik':'genel';
  }
  function secondSifat(R,first){ // Nadir kademe için ikinci sıfat
    var c=[R.keskin>=70?'Keskin':null,R.saglam>=70?'Sağlam':null,METAL_SIFAT[S.A.dom],'Sağlam','Dengeli'];
    for(var i=0;i<c.length;i++) if(c[i]&&c[i]!==first) return c[i];
  }
  function weaponName(R){
    var th=THEMES[themeOf(R)], m=S.A.ad, wk=WS().kok, wt=WS().tam;
    if(R.tier===0) return {ad:'Çatlak '+m+' '+wk};
    if(R.tier===1) return {ad:m+' '+wk};
    if(R.tier===2) return {ad:th.sifat+' '+m+' '+wk};
    if(R.tier===3) return {ad:secondSifat(R,th.sifat)+' ve '+th.sifat+' '+m+' '+wk};
    if(R.tier===4) return {ad:pick(th.unvan)+' '+m+' '+wt};
    if(R.tier===5) return {ad:'«'+pick(th.destan)+'»',alt:th.lakap+' · '+m+' '+wt};
    return {ad:null,oneri:pick(th.destan),alt:th.lakap+' · '+m+' '+wt}; // Mitik: adını oyuncu koyar
  }

  // ---------- durum ----------
  var S={phase:0,wt:'kilic',sub:'sovalye',slots:['demir','demir','demir'],coal:'orta',liq:'su',scores:{},extra:{},A:null};
  var P={}, parts=[], labels=[], ptr={down:false,x:0,y:0}, T=0;

  // ---------- oda arka planı (bir kez çizilir) ----------
  var room=document.createElement('canvas'); room.width=W; room.height=H;
  (function(){
    var r=room.getContext('2d');
    r.fillStyle='#2a1a12'; r.fillRect(0,0,W,H);
    for(var y=0,row=0;y<190;y+=10,row++){
      for(var x=(row%2?-10:0);x<W;x+=20){
        r.fillStyle=((x+y)/10)%3<1?'#33211a':'#2e1d16'; r.fillRect(x+1,y+1,18,8);
      }
    }
    r.fillStyle='#1d120c'; r.fillRect(0,190,W,50);
    r.fillStyle='#160d08'; for(var py=196;py<H;py+=9) r.fillRect(0,py,W,1);
    r.fillStyle='#3a2616'; r.fillRect(0,189,W,2);
  })();

  // ---------- parçacık + yazılar ----------
  function burst(x,y,n,cols,spd,grav,life){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, s=spd*(.4+Math.random()*.8);
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.3,life:life*(.6+Math.random()*.6),
                  max:life,col:cols[i%cols.length],sz:Math.random()<.3?2:1,grav:grav});
    }
  }
  function label(text,col,x,y){labels.push({text:text,col:col,x:x,y:y,life:.9});}
  function updFx(dt){
    parts=parts.filter(function(p){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;return p.life>0;});
    labels=labels.filter(function(l){l.life-=dt;l.y-=14*dt;return l.life>0;});
  }
  function drawFx(){
    parts.forEach(function(p){
      var k=clamp(p.life/p.max,0,1); g.fillStyle=p.col;
      if(p.r){g.globalAlpha=k*.45;g.beginPath();g.arc(p.x,p.y,p.r+(1-k)*p.grow,0,Math.PI*2);g.fill();} // buhar bulutu
      else{g.globalAlpha=k;g.fillRect(p.x|0,p.y|0,p.sz,p.sz);}
    });
    g.globalAlpha=1;
    g.font='bold 8px monospace'; g.textAlign='center';
    labels.forEach(function(l){
      g.globalAlpha=clamp(l.life*2,0,1);
      g.fillStyle='#000'; g.fillText(l.text,(l.x|0)+1,(l.y|0)+1);
      g.fillStyle=l.col; g.fillText(l.text,l.x|0,l.y|0);
    });
    g.globalAlpha=1;
  }

  // ---------- arayüz ----------
  function setSteps(){
    $('steps').innerHTML=STEPS.map(function(s,i){
      return '<span class="step'+(i===S.phase?' on':i<S.phase?' done':'')+'">'+s+'</span>';
    }).join('');
  }
  function setText(cap,hint){$('cap').textContent=cap;$('hint').innerHTML=hint||'';}
  function setBar(groups){
    var bar=$('bar'); bar.innerHTML='';
    groups.forEach(function(gr){
      var t=document.createElement('div');t.className='grp';t.textContent=gr.title||'';bar.appendChild(t);
      gr.btns.forEach(function(b){
        var el=document.createElement('button');
        el.className='btn'+(b.sel?' sel':'')+(b.go?' go':'')+(b.cls?' '+b.cls:'');
        el.textContent=b.t; el.disabled=!!b.dis;
        if(b.border) el.style.borderColor=b.border;
        el.onclick=b.fn; bar.appendChild(el);
      });
    });
  }
  function finish(key,score,next,msg){
    S.scores[key]=clamp(score,0,1);
    P.done=true; P.endIn=1.3;
    P.next=next;
    label((msg||'')+Math.round(S.scores[key]*100),'#ffd54a',90,40);
  }

  // ---------- ortak çizimler ----------
  function drawHearth(intensity){
    g.fillStyle='#5a3a2a'; g.fillRect(52,168,76,22);
    g.fillStyle='#46291c'; for(var x=52;x<128;x+=12) g.fillRect(x,178,1,12);
    g.fillStyle='#120a06'; g.fillRect(62,172,56,16);
    for(var i=0;i<9;i++){
      var fh=(5+Math.sin(T*12+i*1.7)*2+Math.random()*2)*intensity*1.5;
      g.fillStyle=i%2?'#ff8a2a':'#ffc23a'; g.fillRect(64+i*6,188-fh,5,fh);
    }
    g.globalAlpha=.12*intensity; g.fillStyle='#ff8a2a';
    g.beginPath(); g.arc(90,178,44,0,Math.PI*2); g.fill(); g.globalAlpha=1;
  }
  function poly(pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();}
  // Her metal kendi biçiminde: demir = kaba cevher, çelik = külçe, mitril = kristal.
  function drawPiece(kind,x,y){
    x=Math.round(x); y=Math.round(y);
    if(kind==='demir'){
      g.fillStyle='#1a1210'; poly([[x+2,y-1],[x+10,y-2],[x+16,y+3],[x+15,y+10],[x+5,y+11],[x-1,y+6]]);
      g.fillStyle='#5f5a56'; poly([[x+3,y],[x+10,y-1],[x+15,y+3],[x+14,y+9],[x+5,y+10],[x,y+6]]);
      g.fillStyle='#837c75'; poly([[x+3,y],[x+10,y-1],[x+11,y+3],[x+4,y+4]]);
      g.fillStyle='#3e3a37'; poly([[x+11,y+3],[x+15,y+3],[x+14,y+9],[x+9,y+8]]);
      g.fillStyle='#9a5530'; g.fillRect(x+6,y+5,2,1); g.fillRect(x+11,y+6,1,1); g.fillRect(x+3,y+6,1,1); g.fillRect(x+8,y+2,1,1);
    } else if(kind==='celik'){
      g.fillStyle='#1a1210'; poly([[x+1,y],[x+14,y],[x+16,y+8],[x-1,y+8]]);
      g.fillStyle='#8d96a0'; poly([[x+2,y+1],[x+13,y+1],[x+15,y+7],[x,y+7]]);
      g.fillStyle='#d6dde4'; g.fillRect(x+2,y+1,11,1); g.fillRect(x+2,y+2,1,4);
      g.fillStyle='#646c76'; g.fillRect(x,y+6,15,1);
      g.fillStyle='#b4bcc6'; g.fillRect(x+5,y+3,5,1);
    } else {
      g.fillStyle='#1a1210'; poly([[x,y+10],[x+3,y-2],[x+6,y+3],[x+10,y-5],[x+15,y+10]]);
      g.fillStyle='#5fbcc4'; poly([[x+1,y+9],[x+3,y],[x+6,y+4],[x+10,y-3],[x+14,y+9]]);
      g.fillStyle='#9fe3e8'; poly([[x+10,y-3],[x+14,y+9],[x+10,y+9]]); poly([[x+3,y],[x+6,y+4],[x+5,y+9],[x+1,y+9]]);
      g.fillStyle='#e8ffff'; g.fillRect(x+10,y-2,1,6); g.fillRect(x+3,y+1,1,4);
    }
  }
  function drawCrucible(){
    g.fillStyle='#3d3a38'; g.beginPath(); g.moveTo(72,146); g.lineTo(108,146); g.lineTo(104,170); g.lineTo(76,170); g.fill();
    g.fillStyle='#55504c'; g.fillRect(72,146,36,2);
  }
  // Cüce demircinin kolu: (gx,gy) eldivenin bileği, (ex,ey) yalnızca kolun yönü (uzunluk sabit, kısa).
  // Yerel x: bilekten dirseğe. Sıvanmış kalın yen, kıllı tıknaz ön kol (üç tonlu kas), perçinli deri bileklik-eldiven.

  // Sapı kavrayan iri, eldivenli cüce yumruğu; sap yerel y ekseni boyunca uzanır.
  // Bir yanda sapı saran dört parmak boğumu, üstte kapanan başparmak, diğer yanda elin sırtı.
  function drawFist(x,y,rot){
    var O='#1a1210', i;
    g.save(); g.translate(x,y); g.rotate(rot);
    g.fillStyle=O; poly([[-6,-8],[5,-8],[8,-6],[8.5,5],[6,7.5],[-6,7.5],[-9,5],[-9,-5.5]]);
    // elin sırtı
    g.fillStyle='#6e4222'; poly([[0,-7],[5,-7],[7.5,-5],[7.5,4.5],[5.5,6.5],[0,6.5]]);
    g.fillStyle='#8a5630'; poly([[0,-7],[5,-7],[7.5,-5],[7.5,-1],[0,-1]]);
    // dört parmak: her biri yuvarlatılmış boğum, aralarında kıvrım
    for(i=0;i<4;i++){
      var fy=-7+i*3.6;
      g.fillStyle='#7a4a26'; poly([[-7,fy+.5],[-1,fy],[0,fy+1],[0,fy+3.2],[-1,fy+3.6],[-7,fy+3.2],[-8,fy+1.8]]);
      g.fillStyle='#a8703e'; g.fillRect(-7,fy+.6,5,1);   // boğum ışığı
      g.fillStyle='#c48a50'; g.fillRect(-7.5,fy+1,1,1);   // boğum ucu parlaması
      if(i<3){g.fillStyle='#3e2412'; g.fillRect(-8,fy+3.4,8,.8);} // parmak arası
    }
    // başparmak: üstten sapın etrafına kapanır
    g.fillStyle=O; poly([[-1,-9],[6,-8],[7,-5.5],[1,-5],[-2,-6.5]]);
    g.fillStyle='#9a6434'; poly([[-.5,-8.3],[5.5,-7.5],[6.2,-6],[1,-5.8],[-1.2,-6.8]]);
    g.fillStyle='#b88048'; g.fillRect(1,-8,3,1);
    // dikiş + bilek kayışı tokası
    g.fillStyle='#c9a46a'; for(i=-5;i<6;i+=3) g.fillRect(5,i,1,1);
    g.fillStyle=O; g.fillRect(6.5,1,2.5,4); g.fillStyle='#c9ced6'; g.fillRect(7,1.5,1.5,3);
    g.restore();
  }

  function drawPattern(st,L,hw,bTop){
    var c=st.patCol, i, y, x, k, span=-bTop-2, seed=st.blade.charCodeAt(2)+st.pattern.length*7;
    function rs(n){var v=Math.sin(n*12.9898+seed*7.1)*43758.5453;return v-Math.floor(v);}
    g.fillStyle=c;
    if(st.pattern==='pas'){ // pas lekeleri
      for(i=0;i<18;i++) g.fillRect(Math.round(-hw+1+rs(i)*(2*hw-2)),Math.round(bTop+2+rs(i+40)*span),1,rs(i+80)<.3?2:1);
    } else if(st.pattern==='sam'){ // şam çeliği dalgaları
      for(k=-1;k<=1;k++) for(y=Math.ceil(bTop+2);y<-1;y++){x=k*hw*.55+Math.sin(y*.35+k*2)*1.3;g.fillRect(Math.round(x),y,1,1);}
    } else if(st.pattern==='damar'){ // parlayan damarlar
      for(k=0;k<2;k++){x=(k?1:-1)*hw*.5;for(y=Math.ceil(bTop+2);y<-1;y++){x=clamp(x+(rs(y*3+k)-.5)*1.4,-hw+1,hw-1);g.fillRect(Math.round(x),y,1,1);}}
    } else if(st.pattern==='yildiz'){ // yıldız benekleri
      for(i=0;i<10;i++){
        var sx=Math.round(-hw+2+rs(i)*(2*hw-4)), sy=Math.round(bTop+3+rs(i+20)*(span-4));
        g.globalAlpha*=1; g.fillRect(sx,sy,1,1);
        if(i%3===0){g.fillRect(sx-1,sy,3,1);g.fillRect(sx,sy-1,1,3);}
      }
    } else if(st.pattern==='ay'){ // hilal izleri
      g.strokeStyle=c; g.lineWidth=1;
      for(i=0;i<3;i++){var cy=bTop+12+i*(span-18)/2;g.beginPath();g.arc(0,cy,hw*.55,-.3*Math.PI,.9*Math.PI);g.stroke();}
    } else if(st.pattern==='serit'){ // üç renkli çapraz şeritler
      var cols=['#6d6a66','#e0e6ec','#9fe3e8'], a0=g.globalAlpha;
      g.globalAlpha=a0*.55;
      for(y=Math.ceil(bTop+1);y<0;y++) for(x=Math.ceil(-hw);x<hw;x++){g.fillStyle=cols[Math.floor((y+x*.7+200)/4)%3];g.fillRect(x,y,1,1);}
      g.globalAlpha=a0;
    } else if(st.pattern==='rune'){ // parlayan rün oluğu
      var a1=g.globalAlpha; g.globalAlpha=a1*(.6+.3*Math.sin(T*4));
      g.fillRect(-1,bTop+6,2,span-12);
      for(i=0;i<5;i++) g.fillRect(-2,Math.round(bTop+12+i*(span-24)/4),4,1);
      g.globalAlpha=a1;
    }
  }

  // ---------- ISIT sahnesi: raylı vinç + zincirde asılı pota + kor yatağı + deri körük ----------

  var RIG={railY:52,px:88,py:128};
  function drawRig(h,pump,flame,full){

    g.fillStyle='#5f646c'; g.fillRect(8,RIG.railY,1,137); g.fillRect(146,RIG.railY,1,137);
    g.fillStyle=O; g.fillRect(3,RIG.railY-5,152,9);
    g.fillStyle='#5f646c'; g.fillRect(4,RIG.railY-4,150,7);
    g.fillStyle='#8a9099'; g.fillRect(4,RIG.railY-4,150,1);
    g.fillStyle='#3a3e45'; g.fillRect(4,RIG.railY+1,150,1);

    // makaralı araba

    g.fillStyle=O; g.fillRect(tx-9,ty-7,18,8); g.beginPath(); g.arc(tx-5,ty-1,3.5,0,Math.PI*2); g.arc(tx+5,ty-1,3.5,0,Math.PI*2); g.fill();
    g.fillStyle='#8a6a2a'; g.fillRect(tx-8,ty-6,16,5); g.fillStyle='#b08a3a'; g.fillRect(tx-8,ty-6,16,1);
    g.fillStyle='#8a9099'; g.beginPath(); g.arc(tx-5,ty-1,2.2,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(tx+5,ty-1,2.2,0,Math.PI*2); g.fill();
    g.fillStyle=O; g.fillRect(tx-2,RIG.railY+4,4,4);
    // zincir
    for(cy=RIG.railY+8,k=0;cy<RIG.py-29;cy+=4,k++){ // zincir potanın kulpuna kadar iner

  function drawForgeBed(intensity){

    for(r=0;r<3;r++) for(i=0;i<9;i++){g.fillStyle=(i+r)%2?'#5a4a40':'#4a3c34';g.fillRect(45+i*10-(r%2?5:0),160+r*10,9,9);}
    g.fillStyle=O; g.fillRect(44,158,1,33); g.fillRect(133,158,1,33);
    // kor yatağı
    for(i=0;i<16;i++){var hg=3+(i*7)%3;g.fillStyle=mix('#5a1a08','#ffb03a',clamp(.3+.6*intensity*(.6+.4*Math.sin(T*6+i*1.3)),0,1));g.fillRect(49+i*5,160-hg,5,hg);}
    // alevler potanın dibine doğru
    for(i=0;i<8;i++){
      var fh=(6+Math.sin(T*12+i*1.7)*3+Math.random()*3)*intensity*1.6;
      g.fillStyle=i%2?'#ff8a2a':'#ffc23a'; g.fillRect(66+i*6,157-fh,4,fh);

    g.globalAlpha=.14*intensity; g.fillStyle='#ff8a2a'; g.beginPath(); g.arc(89,150,46,0,Math.PI*2); g.fill(); g.globalAlpha=1;
  }
  function drawHangingPot(h,full){
    var x=RIG.px, y=RIG.py, O='#1a1210';
    g.strokeStyle=O; g.lineWidth=3; g.beginPath(); g.moveTo(x-17,y-12); g.quadraticCurveTo(x,y-44,x+17,y-12); g.stroke();
    g.strokeStyle='#8a9099'; g.lineWidth=1; g.beginPath(); g.moveTo(x-17,y-12); g.quadraticCurveTo(x,y-44,x+17,y-12); g.stroke();
    g.save(); g.translate(x,y);
    g.fillStyle='#120e0c'; poly([[-18,-16],[16,-16],[22,-19],[19,-13],[14,12],[10,15],[-10,15],[-14,12]]);
    g.fillStyle='#3a3432'; poly([[-17,-15],[15,-15],[20.5,-17.5],[18,-13],[13,11],[9.5,14],[-9.5,14],[-13,11]]);
    g.fillStyle='#4e4642'; poly([[-17,-15],[-14.5,-15],[-11,11],[-13,11]]);
    g.fillStyle='#55504c'; g.fillRect(-17,-15,32,2);

    g.fillStyle=full?heatColor(h):'#1e1a18'; g.beginPath(); g.ellipse(-1,-13,14,2.5,0,0,Math.PI*2); g.fill();
    if(full&&h>.35){g.globalAlpha=.3*h;g.fillStyle=heatColor(h);g.beginPath();g.arc(-1,-14,18,0,Math.PI*2);g.fill();g.globalAlpha=1;}
    g.fillStyle=O; g.fillRect(-19,-14,4,4); g.fillRect(15,-14,4,4); // kulp kulakları

  // Deri körük: kama biçimli, katlanır; üst tahtanın kolu bastırılınca hava borudan ocağa üfler. pump: 0 açık → 1 basılı
  function drawBellows(pump){
    var O='#1a1210', x0=6, x1=44, base=184, hgt=4+14*(1-pump), topL=base-hgt, topR=base-hgt*.35, i;
    g.fillStyle=O; g.fillRect(x0-1,base-1,x1-x0+2,6); g.fillStyle='#6b4424'; g.fillRect(x0,base,x1-x0,4);

    g.fillStyle=O; poly([[x0-2,topL-4],[x1+1,topR-3],[x1+1,topR],[x0-2,topL]]);
    g.fillStyle='#8a5a32'; poly([[x0-1,topL-3],[x1,topR-2],[x1,topR-1],[x0-1,topL-1]]);
    var hx=x0+3, hy=topL-4; // kol + tutamak
    g.fillStyle=O; g.fillRect(hx-2,hy-34,5,34); g.fillStyle='#6b4424'; g.fillRect(hx-1,hy-33,3,33);
    g.fillStyle=O; g.fillRect(hx-5,hy-38,11,5); g.fillStyle='#8a5a32'; g.fillRect(hx-4,hy-37,9,3);
    g.fillStyle=O; g.fillRect(x1,base-5,14,5); g.fillStyle='#5f646c'; g.fillRect(x1,base-4,14,3); g.fillStyle='#8a9099'; g.fillRect(x1,base-4,14,1); // hava borusu

  // ---------- envanter: cevherler + yapılan silahlar (bu tarayıcıda saklanır) ----------
  // Potaya yalnız envanterdeki cevher atılır ve envanterden düşer; biten silah envantere girer.
  // Silah geri eritilebilir ama her eritmede 3 cevherden biri kaybolur (yaptıkça-erittikçe malzeme azalır).
  var INV_KEY='demirusta_envanter', START_ORES={demir:6,celik:3,mitril:1}, ORE_NAME={demir:'Demir cevheri',celik:'Çelik külçesi',mitril:'Mitril kristali'};
  var INV=loadInv();
  function loadInv(){
    try{var v=JSON.parse(localStorage.getItem(INV_KEY)||'null'); if(v&&v.ores&&v.weapons) return v;}catch(e){}
    return {ores:Object.assign({},START_ORES),weapons:[]};
  }
  function saveInv(){try{localStorage.setItem(INV_KEY,JSON.stringify({ores:INV.ores,weapons:INV.weapons}));}catch(e){}}
  function slotUse(k,except){var n=0;S.slots.forEach(function(s,i){if(s===k&&i!==except)n++;});return n;}
  function canUse(k,i){return INV.ores[k]-slotUse(k,i)>0;} // i. yuvaya k cevheri konabilir mi (diğer yuvalar düşülünce)
  function oreTotal(){return MKEYS.reduce(function(a,k){return a+INV.ores[k];},0);}
  function fixSlots(){S.slots.forEach(function(s,i){if(!canUse(s,i)){var alt=MKEYS.filter(function(k){return canUse(k,i);})[0];if(alt)S.slots[i]=alt;}});}
  function slotsOk(){return S.slots.every(function(s,i){return canUse(s,i);});}
  function meltWeapon(idx){
    var w=INV.weapons[idx]; if(!w) return;
    var lost=Math.floor(Math.random()*w.slots.length), back=w.slots.filter(function(_,i){return i!==lost;});
    back.forEach(function(k){INV.ores[k]++;});
    INV.weapons.splice(idx,1); saveInv();
    INV.msg='🔥 <b>'+w.ad+'</b> eritildi → geri: '+back.map(function(k){return ORE_NAME[k];}).join(', ')+
            ' · <span style="color:#ff9a5a">kayıp: '+ORE_NAME[w.slots[lost]]+'</span>';
    if(S.phase===0){fixSlots();PH[0].ui();}
    renderInv();
  }
  function renderInv(){
    var el=$('inv'); if(!el) return;
    var ores=MKEYS.map(function(k){
      return '<span class="ore" style="border-color:'+METALS[k].ingot+'">'+ORE_NAME[k]+' <b>×'+INV.ores[k]+'</b></span>';}).join('');
    var ws=INV.weapons.map(function(w,i){return {w:w,i:i};}).reverse().map(function(o){
      var t=TIERS[o.w.tier];
      return '<div class="wrow"><span><b style="color:'+t[1]+'">'+o.w.ad+'</b><br><small>'+t[0]+' · '+o.w.tur+' · '+o.w.metal+' · 🪙 '+o.w.deger.toLocaleString('tr-TR')+'</small></span>'+
             '<button class="btn melt" data-melt="'+o.i+'">🔥 Erit</button></div>';}).join('');
    el.innerHTML='<div class="invh">🎒 Envanter</div><div class="ores">'+ores+'</div>'+
      (INV.msg?'<div class="imsg">'+INV.msg+'</div>':'')+
      '<div class="invs">Silahlar ('+INV.weapons.length+') — eritince 3 cevherden 1\'i kaybolur</div>'+
      (ws||'<div class="empty">Henüz silah yok.</div>')+
      '<button class="btn reset" id="invreset">↺ Başlangıç stoğu</button>';
  }

  // =====================================================================

  // =====================================================================
  // 1) ISIT — körüğü basılı tut, ibreyi ideal bölgede tut
  // =====================================================================
  var GX=158, GY0=30, GY1=200, GH=GY1-GY0, FILL_NEED=5, HEAT_TIMEOUT=16;
  PH[1]={
    enter:function(){
      P={h:0,v:0,fill:0,acc:0,t:0,firstIn:-1,pump:0,pt:0,intro:1.1,zc:S.A.zc,kick:1.5};
      setText('ISIT','Ekrana <b>basılı tut</b> → körük pompalar, ısı yükselir. <b>Bırak</b> → düşer.<br>İbreyi bölgenin <b>ortasında</b> tut. '+
        (S.A.D>.3?'Kıymetli metalde bölge <b>kayar</b>, ':'')+'kömür patlamaları ibreyi iter!');
      setBar([]);
    },
    update:function(dt){
      if(P.done) return;
      if(P.intro>0){ // külçeler potaya düşüyor
        var before=P.intro; P.intro-=dt;
        for(var i=0;i<3;i++){var land=1.1-(.25+i*.25);if(before>land&&P.intro<=land)burst(RIG.px,RIG.py-16,6,['#8a8070','#ffcf8a'],30,80,.4);}
        return;
      }
      var m=S.A, k=COAL[S.coal].k, D=m.D;
      P.zc=m.zc+D*(.05*Math.sin(P.t*.9)+.03*Math.sin(P.t*2.3+1)); // bölge kayması
      if(ptr.down) P.v+=.9*m.agi*k*dt; else P.v-=.75*m.agi*dt;
      P.v-=.05*dt;
      P.kick-=dt;
      if(P.kick<=0){ // kömür patlaması: ibreye ani itme
        P.kick=Math.max(.6,1.2+Math.random()*1.3-D*.6);
        var push=(Math.random()<.5?-1:1)*(.08+.25*D);
        P.v+=push;
        label(push>0?'çıt!':'fıss…',push>0?'#ffcf8a':'#9fc8ff',104+Math.random()*20,150);
        burst(89,156,push>0?8:4,push>0?['#ffc23a','#fff6d8']:['#8a8070'],45,60,.4);
      }
      P.v*=Math.exp(-2.5*dt);
      P.h+=P.v*dt;
      if(P.h<0){P.h=0;P.v=0;} if(P.h>1){P.h=1;P.v=0;}
      // körük: basılı tutunca kol inip kalkar (pompalar); her basışta borudan ocağa hava
      var prev=P.pump;
      if(ptr.down){P.pt+=dt*8;P.pump+=(.5+.5*Math.sin(P.pt)-P.pump)*Math.min(1,dt*20);}
      else P.pump+=(0-P.pump)*Math.min(1,dt*8);
      if(P.pump>prev && Math.random()<dt*40) parts.push({x:58,y:181,vx:30+Math.random()*15,vy:-4-Math.random()*8,life:.45,max:.45,col:'#e8dcc8',sz:1,grav:0});
      var off=Math.abs(P.h-P.zc)/m.zw, inZ=off<1;
      P.t+=dt;
      if(P.firstIn>=0 || inZ){
        if(P.firstIn<0) P.firstIn=P.t;
        if(inZ){
          P.fill+=dt/(FILL_NEED+2*D);
          P.acc+=dt*(1-.8*off*off); // merkez 1, kenar 0.2
          if(Math.random()<dt*10) burst(RIG.px-1,RIG.py-15,1,['#ffc23a','#ff8a2a'],18,-10,.5);
        }
      }
      if(P.fill>=1 || P.t>HEAT_TIMEOUT){
        var span=P.firstIn<0?P.t:P.t-P.firstIn;
        finish('heat',span>0?P.acc/span:0,2,'ISIT ');
      }
    },
    draw:function(){
      var m=S.A;
      g.drawImage(room,0,0);
      drawRig(P.h,P.pump,.35+.65*clamp(P.v*4+P.pump*.3,0,1),P.intro<=0);
      if(P.intro>0){ // malzemeler asılı potaya düşer
        for(var d=0;d<3;d++){
          var el=1.1-P.intro-d*.25; if(el<0) continue;
          var fy=Math.min(RIG.py-20,62+el*el*400);
          if(fy<RIG.py-20) drawPiece(S.slots[d],RIG.px-21+d*9,fy);
        }
      }
      for(var y=0;y<GH;y++){g.fillStyle=heatColor(1-y/GH);g.fillRect(GX,GY0+y,8,1);}
      var zt=GY1-(P.zc+m.zw)*GH, zb=GY1-(P.zc-m.zw)*GH, zm=GY1-P.zc*GH, inZ=Math.abs(P.h-P.zc)<m.zw;
      g.strokeStyle=inZ?'#fff':'#ffd54a'; g.lineWidth=1;
      g.strokeRect(GX-2.5,zt+.5,13,zb-zt-1);
      g.fillStyle='#fff'; g.fillRect(GX-3,zm,2,1); g.fillRect(GX+9,zm,2,1);
      if(inZ){g.globalAlpha=.2+.15*Math.sin(T*10);g.fillStyle='#fff';g.fillRect(GX,zt,8,zb-zt);g.globalAlpha=1;}
      var ny=GY1-P.h*GH;
      g.fillStyle=inZ?'#fff':'#ffcf8a'; g.beginPath(); g.moveTo(GX-2,ny); g.lineTo(GX-9,ny-4); g.lineTo(GX-9,ny+4); g.fill();
      g.fillStyle='#120a06'; g.fillRect(GX-1,GY0-1,10,1); g.fillRect(GX-1,GY1,10,1);
      g.fillStyle='#120a06'; g.fillRect(14,14,128,7);
      g.fillStyle='#ffc23a'; g.fillRect(15,15,126*clamp(P.fill,0,1),5);
      g.fillStyle='#ffe9b0'; g.fillRect(15,15,126*clamp(P.fill,0,1),1);

  var SW_X=32, SW_Y=112, MAX_PASS=5, SPD_LO=45, SPD_HI=115, SPD_MAX=160, SPD_WIN=.12;
  // Türe göre bileme yolu: silah yatay (uç sağda) çizilir; yol, aşağı bakan ağzın üstünden geçer.
  // x0..x1: bilenecek aralık, base(x): o noktadaki ağzın yüksekliği.
  // Bileme yerleşimi: parça (dövülmüş hâl) ağzı aşağı bakacak biçimde konur, yol ağzın kendi hattını izler
  // (kavisli kılıçta kavisli). place: parça çerçevesinin dünyadaki yeri/dönüşü, base(x): o noktadaki ağız yüksekliği,
  // hold: çıplak metali tutan el — kılıçta sap ucunu doğrudan kavrar, balta/mızrakta maşayla tutar.
  function grindCfg(){
    var s=WS(), G=partGeo(s,1), c={G:G};
    if(G.kind==='axe'){ // +90° döndürülür: (px,py) → (cx-py, cy+px); ağız aşağıda yatay olur
      var cx=100, cy=100, E=G.edge;
      c.place={x:cx,y:cy,rot:Math.PI/2};
      c.x0=cx-E[E.length-1][1]+3; c.x1=cx-E[0][1]-3;
      c.base=function(x){return cy+edgeXAt(E,cx-x)-1.5;};
      c.hold={htong:[cx-G.minY+30,cx-G.minY+2,cy+1],arm:[cx-G.minY+70,cy-50]}; // sağdan, başın üst ucundan tutar
    } else {
      var gx=G.spear?58:34, gy=110;
      c.place={x:gx,y:gy,rot:0};
      c.x0=gx+(G.spear?13:4); c.x1=gx+G.L*.9;
      c.base=function(x){return gy+yAt(G.B,x-gx)-1;};
      c.hold=G.tang?{fist:[gx-12,gy+G.M[0][1],Math.PI/2],arm:[gx-60,gy-50]}:{tong:[gx+5,gy-34,gy-4],arm:[gx-40,gy-86]};
    }
    c.x0=Math.round(c.x0); c.x1=Math.round(c.x1);
    return c;
  }

      var j=c.s.length-1; while(j>0 && now-c.s[j-1].t<=SPD_WIN*1000) j--;

      if(span>=.03){var v=Math.max(0,(x-s0.x)/span); P.spd+=(v-P.spd)*.35;}
      c.s.push({x:x,y:y,t:now,v:P.spd});
      if(!c.burn && P.spd<12 && c.s.length>4){c.slow+=dt; if(c.slow>.35) this.burn({x:x,y:y});} else c.slow=0;
      var inB=P.spd>=SPD_LO&&P.spd<=SPD_HI, dev=Math.abs(y-this.edge(x)), near=dev<P.tol;
      // geçilen sütunlar iyi geçişte daha çok parlar
      var q=(near?1-dev/P.tol:0)*(inB?1:.5);
      var c0=Math.round(Math.min(lp.x,x))-P.gx0, c1=Math.round(Math.max(lp.x,x))-P.gx0;
      for(var cc=Math.max(0,c0);cc<=Math.min(P.gx1-P.gx0,c1);cc++) P.gm[cc]=Math.min(1,P.gm[cc]+q*.45);
      // kıvılcımlar çarkın kılıca değdiği noktadan, çarkın dönüş yönünde (sağa) fışkırır
      var good=inB&&near, ey=this.edge(P.wx);
      for(var k2=0;k2<(good?3:1);k2++)
        parts.push({x:P.wx+2,y:ey+1,vx:50+Math.random()*(good?110:50),vy:-45+Math.random()*50,life:.3+Math.random()*.3,max:.6,
                    col:good?['#ffd54a','#fff6d8','#ff8a2a'][k2]:'#ff6a3a',sz:1,grav:130});
      if(x>=P.gx1-4) this.endPass();
    },
    up:function(){
      if(P.cur){P.cur=null;label('Yarım kaldı','#ff9a5a',90,94);}
    },
    endPass:function(){
      var c=P.cur, s=c.s, self=this; P.cur=null;
      var dev=0; s.forEach(function(p){dev+=Math.abs(p.y-self.edge(p.x));}); dev/=s.length;
      var acc=clamp(1-dev/P.tol,0,1);
      var vs=s.filter(function(p){return p.v!==undefined;});
      var inB=vs.filter(function(p){return p.v>=SPD_LO&&p.v<=SPD_HI;}).length/Math.max(1,vs.length);
      var dur=(s[s.length-1].t-s[0].t)/1000;
      var ps=acc*.6+inB*.4;
      if(dur<.4*(P.gx1-P.gx0)/108) ps*=.6; // çok hızlı süpürme (kısa ağızda süre de kısalır)
      if(c.burn) ps*=.6;
      ps=clamp(ps,0,1);
      P.passes.push(ps);
      P.sharp=Math.min(100,P.sharp+6+16*ps);
      P.dur=Math.max(20,P.dur-(4+4*(1-ps))-(c.burn?8:0)); // iyi geçiş az aşındırır
      label('Geçiş '+P.passes.length+': '+Math.round(ps*100),ps>.75?'#ffd54a':'#ffcf8a',90,94);
      if(P.passes.length>=MAX_PASS) this.done(); else this.ui();
    },

  // =====================================================================
  // 7) SONUÇ — beceri tabanı (metalin aralığına yayılır), şans tavanı + dramatik açılış
  // =====================================================================
  function compute(){
    var sc=S.scores, A=S.A, l=S.liq;
    var perf=WEIGHTS.heat*sc.heat+WEIGHTS.forge*sc.forge+WEIGHTS.quench*sc.quench+WEIGHTS.grind*sc.grind;
    // Performans eğrisi: üst kademeler gerçekten iyi oyun ister.
    var curve=Math.pow(clamp(perf,0,1),1.6);
    var raw=A.minT+Math.floor(curve*(A.maxT-A.minT)+1e-9);
    var base=clamp(raw,A.minT,A.maxT-1);
    var p1=.06+.12*perf, p2=.015*Math.pow(perf,4);
    var r=Math.random(), up=r<p2?2:r<p1?1:0;
    var tier=Math.min(base+up,A.maxT);
    if(tier===6 && up!==2) tier=5;
    up=tier-base;
    var sharp=S.extra.sharp+(l==='su'?10:0)+(l==='buz'?6:0)+(WS().keskinB||0); // katana/hançer gibi biçimler daha keskin
    var dur=S.extra.dur*(.75+.25*sc.quench)+(l==='yag'?8:0)-(l==='su'?5:0)-(S.extra.quench==='geç'?10:0)-(S.extra.quench==='erken'?4:0);
    var gp=S.grip, uy=!!(gp&&gp.uyum===A.dom); // BİRLEŞTİR'de takılan kabza/sap
    if(gp) dur+=gp.dur+(uy?5:0);
    var traits=A.traits.slice();
    if(gp&&gp.trait) traits.push(gp.trait);
    if(uy) traits.push('✓ '+gp.uyumAd);
    if(l==='buz') traits.push(A.n.mitril?'❄️ Buz ×2 (iletken)':'❄️ Buz');
    if(S.extra.quench==='erken') traits.push('Yumuşak');
    if(S.extra.quench==='geç') traits.push('Kırılgan');
    if(sc.heat>.9) traits.push('Dengeli');
    if(S.extra.perfects>=8) traits.push('✨ Usta Vuruşu');
    return {perf:perf,base:base,tier:tier,up:up,capped:raw>=A.maxT-1,floored:A.minT>0&&raw===A.minT,
      gr:Math.round(A.gr*WS().grK*(gp?gp.grK:1)*(S.extra.passes?1-.02*S.extra.passes:1)),
      deger:Math.round(A.deger*WS().degerK*(gp?gp.degerK*(uy?1.1:1):1)*Math.pow(1.9,tier)),
      hasar:Math.round(A.hasar*WS().hasarK*(gp&&gp.trait?1.05:1)*(.6+.6*sc.forge)*(1+tier*.08)),
      keskin:Math.round(clamp(sharp,0,100)), saglam:Math.round(clamp(dur,0,100)), traits:traits,
      risk:clamp(Math.round((100-clamp(dur,0,100))/4),1,25)}; // 100 savaş vuruşunda kırılma ihtimali (%)
  }
  PH[7]={
    enter:function(){
      var R=compute();
      P={R:R,k:Math.min(S.A.minT,R.tier),tt:0,revealed:false,rays:0};
      setText('…','Işık kademeleri dolaşıyor…'); setBar([]);
    },
    update:function(dt){
      P.rays+=dt*(P.revealed?.6:2.5);
      if(P.revealed) return;
      P.tt+=dt;
      var step=.16+.07*P.k;
      if(P.tt>=step){
        P.tt=0;
        if(P.k<P.R.tier) P.k++;
        else this.reveal();
      }
    },
    reveal:function(){
      P.revealed=true;
      var R=P.R, A=S.A, t=TIERS[R.tier], sc=S.scores;
      var big=R.tier>=5, newAlloy=discover(A);
      burst(90,110,big?80:30,big?['#ffc83a','#fff6d8','#ff4fa0','#4aa3ff']:[t[1],'#fff6d8'],big?110:70,40,big?1.4:.9);
      var N=weaponName(R);
      // biten silah envantere girer (eritilirse içindeki 3 cevherden 2'si geri döner)
      var entry={ad:N.ad||('«'+N.oneri+'»'),tier:R.tier,tur:WS().ad,metal:A.ad,slots:S.slots.slice(),deger:R.deger};
      INV.weapons.push(entry); INV.msg='🎒 <b>'+entry.ad+'</b> envantere eklendi.'; saveInv(); renderInv();
      var nameHtml=N.ad
        ? '<div class="wname" style="color:'+t[1]+'">'+N.ad+'</div>'+(N.alt?'<div class="walt">'+N.alt+'</div>':'')
        : '<div class="walt">Mitik bir silah doğdu — <b>adını sen koy</b>:</div>'+
          '<div class="nameform"><input id="wname" maxlength="24" value="'+N.oneri+'"><button class="btn go" id="wnameok">Adını koy</button></div>'+
          '<div class="walt">'+N.alt+'</div>';
      var ladder='<div class="ladder">'+TIERS.map(function(tt,i){
        return '<span class="lt'+(i===R.tier?' cur':'')+(i<A.minT||i>A.maxT?' off':'')+'" style="--c:'+tt[1]+'">'+tt[0]+'</span>';
      }).join('')+'</div><div class="lnote">'+A.ad+' aralığı: '+TIERS[A.minT][0]+' – '+TIERS[A.maxT][0]+'</div>';
      $('cap').style.color=t[1];
      setText('★ '+t[0].toLocaleUpperCase('tr-TR')+' ★',
        nameHtml+
        (newAlloy?'<div class="found">⚗️ Yeni alaşım keşfedildi: '+A.ad+'!</div>':'')+
        (R.up?'Şans seni <b>'+R.up+' kademe</b> yukarı itti! (taban: '+TIERS[R.base][0]+')':'Taban kademe: <b>'+TIERS[R.base][0]+'</b>')+
        (R.capped&&!R.up?'<br>'+A.ad+' için en iyi taban bu — üstü şansa ya da daha kıymetli metale bağlı.':'')+
        (R.floored?'<br><b>'+A.ad+'</b> kıymetlidir: '+TIERS[A.minT][0]+' altına düşmez.':'')+
        ladder+
        '<table class="res">'+
        '<tr><td>Tür</td><td>'+WS().ad+'</td></tr>'+
        (S.grip?'<tr><td>'+(WEAPONS[S.wt].parca==='kabza'?'Kabza':'Sap')+'</td><td>'+S.grip.ad+'</td></tr>':'')+
        '<tr><td>Metal</td><td>'+A.ad+' · '+A.bulunur+'</td></tr>'+
        '<tr><td>Değer</td><td>🪙 '+R.deger.toLocaleString('tr-TR')+'</td></tr>'+
        '<tr><td>Hasar</td><td>'+R.hasar+'</td></tr>'+
        '<tr><td>Ağırlık</td><td>'+R.gr+' g</td></tr>'+
        '<tr><td>Keskinlik</td><td>'+R.keskin+'</td></tr>'+
        '<tr><td>Sağlamlık</td><td>'+R.saglam+'</td></tr>'+
        '<tr><td>Kırılma riski</td><td style="color:'+(R.risk<=6?'#8fe07a':R.risk<=12?'#ffd54a':'#ff6a5a')+'">%'+R.risk+' / 100 vuruş</td></tr>'+
        '<tr><td>Özellikler</td><td>'+(R.traits.join(', ')||'—')+'</td></tr>'+
        '<tr><td colspan="2" style="padding-top:6px;color:#6b5a48">ISIT '+Math.round(sc.heat*100)+' · DÖV '+Math.round(sc.forge*100)+
          ' · SOĞUT '+Math.round(sc.quench*100)+' · BİLE '+Math.round(sc.grind*100)+' → Performans '+Math.round(R.perf*100)+'</td></tr>'+
        '</table>');
      if(!N.ad){
        $('wnameok').onclick=function(){
          var v=$('wname').value.trim()||N.oneri;
          $('wname').parentNode.outerHTML='<div class="wname" style="color:'+t[1]+'">«'+v.replace(/[<>&"]/g,'')+'»</div>';
          entry.ad='«'+v.replace(/[<>&"]/g,'')+'»'; INV.msg='🎒 <b>'+entry.ad+'</b> envantere eklendi.'; saveInv(); renderInv();
          burst(90,110,40,['#ff4fa0','#ffc83a','#fff6d8'],90,40,1.2);
        };
      }
      setBar([{btns:[{t:'🔁 Tekrar dök',go:true,fn:function(){go(0);}}]}]);
    },
    draw:function(){
      g.drawImage(room,0,0);
      g.fillStyle='rgba(10,5,3,.6)'; g.fillRect(0,0,W,H);
      var col=TIERS[P.k][1];
      g.globalAlpha=P.revealed?.35:.2; g.fillStyle=col;
      for(var i=0;i<10;i++){
        var a=P.rays+i*Math.PI/5;
        g.beginPath(); g.moveTo(90,105);
        g.lineTo(90+Math.cos(a)*140,105+Math.sin(a)*140);
        g.lineTo(90+Math.cos(a+.18)*140,105+Math.sin(a+.18)*140); g.fill();
      }
      g.globalAlpha=1;
      var lift=P.revealed?0:Math.sin(T*6)*1.5;
      // bu silahın kendi biçimi, malzemesi, deseni ve takılan kabzası/sapı; kılıçlar boylarına göre ortalanır
      var sb=WS(), ro={glow:col,gem:col}, ry=150;
      if(sb.kind==='blade'){var GL=partGeo(sb,1).L; ro.scale=1.15; ry=105+(GL-34)*1.15/2;}
      else if(sb.kind==='axe'){ro.len=58;ry=136;} // balta sapı kısa, mızrak sapı uzun
      else ro.len=92;
      drawWeaponAt(90,ry+lift,0,gripStyle(S.A.st,S.grip),ro);
      if(S.A.n.mitril && Math.random()<.15*S.A.n.mitril){ // mitril ışıltısı
        parts.push({x:86+Math.random()*8,y:40+Math.random()*92,vx:0,vy:-6,life:.6,max:.6,col:Math.random()<.5?'#e6ffff':'#a8f0f4',sz:1,grav:0});
      }
      if(!P.revealed){
        g.font='bold 9px monospace'; g.textAlign='center'; g.fillStyle=col;
        g.fillText(TIERS[P.k][0],90,222);
      }
    }
  };

  // ---------- akış ----------
  function go(n){
    S.phase=n; parts=[]; labels=[];
    if(n===0){S.scores={};S.extra={};S.grip=null;$('cap').style.color='';}
    setSteps(); PH[n].enter();
    $('inv').style.display=(n===0||n===7)?'':'none'; renderInv(); // envanter malzeme ve sonuç ekranında görünür
  }
  // envanter düğmeleri: silahı erit / başlangıç stoğuna dön
  $('inv').addEventListener('click',function(e){
    var b=e.target.closest('[data-melt]');
    if(b){meltWeapon(+b.getAttribute('data-melt'));return;}
    if(e.target.id==='invreset'){
      INV={ores:Object.assign({},START_ORES),weapons:INV.weapons}; INV.msg='↺ Cevherler başlangıç stoğuna döndü (silahlar duruyor).'; saveInv();
      if(S.phase===0){fixSlots();PH[0].ui();} renderInv();
    }
  });

  // ---------- giriş ----------
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
    var p=pos(e); ptr.down=true; ptr.x=p.x; ptr.y=p.y;
    var h=PH[S.phase]; if(h.down) h.down(p.x,p.y);
  });
  cv.addEventListener('pointermove',function(e){
    var p=pos(e); ptr.x=p.x; ptr.y=p.y;
    var h=PH[S.phase]; if(ptr.down && h.move) h.move(p.x,p.y);
  });
  function release(){ptr.down=false;var h=PH[S.phase];if(h.up)h.up();}
  cv.addEventListener('pointerup',release);
  cv.addEventListener('pointercancel',release);
  window.addEventListener('keydown',function(e){if(e.code==='Space'&&S.phase===1){e.preventDefault();ptr.down=true;}});
  window.addEventListener('keyup',function(e){if(e.code==='Space'&&S.phase===1){ptr.down=false;}});

  // ---------- döngü ----------
  var last=performance.now();
  function frame(now){
    var dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; T+=dt;
    try{
      var h=PH[S.phase];
      if(h.update) h.update(dt);
      if(P.done && P.endIn!==undefined){P.endIn-=dt; if(P.endIn<=0){var nx=P.next;P.endIn=undefined;go(nx);}}
      updFx(dt);
      PH[S.phase].draw(); drawFx(); // geçişten sonra yeni adımın çizimi
    }catch(err){console.error(err);}
    requestAnimationFrame(frame);
  }
  go(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
